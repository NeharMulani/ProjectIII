<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{font-family:Arial;background:#f2f2f2}
.box{width:320px;margin:100px auto;background:#fff;padding:20px}
input,button{width:100%;padding:10px;margin:10px 0}
button{background:#2874f0;color:white;border:none}
.error{color:red;text-align:center}
</style>
</head>
<body>

<div class="box">
<h3 align="center">Login with OTP</h3>

{% for m in messages %}
<p class="error">{{ m }}</p>
{% endfor %}

<form method="POST">
{% csrf_token %}
<input type="text" name="mobile" placeholder="Enter Mobile Number">
<button>Send OTP</button>
</form>
</div>

</body>
</html>
